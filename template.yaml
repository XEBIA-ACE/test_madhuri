AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal EC2 instance with security best practices

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  MinimalEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-0c94855ba95c71c99 # Amazon Linux 2 AMI (us-east-1)
      KeyName: !Ref KeyName
      Monitoring: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: minimal-ec2-instance
        - Key: Environment
          Value: development
        - Key: ManagedBy
          Value: CloudFormation

  MinimalEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access via port 22
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: minimal-ec2-instance-sg

Outputs:
  InstanceId:
    Description: Instance ID of the EC2 instance
    Value: !Ref MinimalEC2Instance
  PublicIP:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt MinimalEC2Instance.PublicIp